trigger:
  batch: true
  branches:
    include:
      - main
  paths:
    include:
      - .azdo/*
      - src/server/*
      - src/client/ui/*
      - infra/*
      - global.json
      - azure.yaml
      - NuGet.config
      - FakeSurveyGenerator.slnx
      - .config/dotnet-tools.json
      - .dockerignore
      - dapr/*
      - tools/api-contracts/*

pr:
  branches:
    include:
      - main
  paths:
    include:
      - .azdo/*
      - src/server/*
      - src/client/ui/*
      - infra/*
      - global.json
      - azure.yaml
      - NuGet.config
      - FakeSurveyGenerator.slnx
      - .config/dotnet-tools.json
      - .dockerignore
      - dapr/*
      - tools/api-contracts/*

variables:
  isMain: $[eq(variables['Build.SourceBranch'], 'refs/heads/main')]
  azureSubscriptionId: $(AZURE_SUBSCRIPTION_ID)
  azureEnvName: "dev"
  azureResourceGroup: rg-fake-survey-generator
  azureResourceManagerConnection: "Azure Service Connection"
  azureLocation: "South Africa North"
  NUGET_PACKAGES: $(Pipeline.Workspace)/.nuget/packages
  azdVersion: "1.35.0"
  daprCliVersion: "1.18.2"
  daprRuntimeVersion: "1.18.4"

stages:
  - stage: BuildTestApi
    displayName: "Build + Test API"
    jobs:
      # No dependency on Build or BuildTestUI: publish a candidate while validation runs.
      # Only trusted main builds receive registry-writing credentials.
      - job: Package
        displayName: "Package + Publish Candidate Image"
        condition: and(succeeded(), eq(variables.isMain, true))
        pool:
          vmImage: "ubuntu-24.04"
        steps:
          - checkout: self
            fetchDepth: 0

          - task: UseDotNet@2
            displayName: "Install .NET SDK"
            inputs:
              packageType: "sdk"
              useGlobalJson: true
              includePreviewVersions: true

          - task: DotNetCoreCLI@2
            inputs:
              command: custom
              custom: tool
              arguments: install --tool-path ./src/server nbgv --version 3.10.94
            displayName: Install NBGV tool

          - script: ./nbgv cloud -a
            workingDirectory: src/server
            displayName: Set Build Number & Version Variables

          - script: |
              set -euo pipefail
              echo "##vso[task.setvariable variable=ReleaseVersion;isOutput=true]$(NBGV_SemVer1)-build$(Build.BuildId)-attempt$(System.JobAttempt)"
            name: "SetReleaseVersion"
            displayName: "Set unique image and revision version"

          - task: setup-azd@1
            displayName: Install azd
            inputs:
              version: $(azdVersion)

          - task: AzureCLI@2
            name: PublishImage
            displayName: "Build and publish candidate image (no deployment)"
            inputs:
              azureSubscription: $(azureResourceManagerConnection)
              scriptType: bash
              scriptLocation: scriptPath
              scriptPath: .azdo/scripts/publish-image.sh
              visibleAzLogin: false
            env:
              AZURE_SUBSCRIPTION_ID: $(azureSubscriptionId)
              AZURE_ENV_NAME: $(azureEnvName)
              AZURE_LOCATION: $(azureLocation)
              AZURE_RESOURCE_GROUP: $(azureResourceGroup)
              TYPE_SAFE_API_KEY: $(typeSafeApiKey)
              API_VERSION: $(SetReleaseVersion.ReleaseVersion)
              VITE_APP_VERSION: $(NBGV_SemVer1)

      - job: Build
        displayName: "Build + Test"
        pool:
          vmImage: "ubuntu-24.04"
        steps:
          - checkout: self
            fetchDepth: 0

          - script: python3 .azdo/tests/test_pipeline.py
            displayName: "Check CI workflow invariants"

          - task: UseNode@1
            displayName: "Install Node.js for acceptance tests"
            inputs:
              version: "26.x"

          - task: UseDotNet@2
            displayName: "Install .NET SDK"
            inputs:
              packageType: "sdk"
              useGlobalJson: true
              includePreviewVersions: true

          - script: bash .azdo/scripts/report-disk-usage.sh "After SDK install"
            displayName: "Measure disk usage before build"
            condition: always()

          # Hosted agents come with unused preloaded images; prune before Dapr and Aspire pull test dependencies.
          - script: docker image prune --all --force
            displayName: "Prune unused preloaded Docker images"

          - script: bash .azdo/scripts/report-disk-usage.sh "After Docker image prune"
            displayName: "Measure disk usage after Docker image prune"
            condition: always()

          - script: dotnet restore FakeSurveyGenerator.slnx --locked-mode
            displayName: "Restore locked solution dependencies"

          - task: DotNetCoreCLI@2
            inputs:
              command: "build"
              projects: "FakeSurveyGenerator.slnx"
              arguments: "--no-restore --configuration Debug"
            displayName: "Build Solution"

          - script: bash .azdo/scripts/report-disk-usage.sh "After solution build"
            displayName: "Measure disk usage after build"
            condition: always()

          # Cert Trust Related Issue: https://github.com/dotnet/aspire/issues/13612
          - script: |
              set -euo pipefail
              curl --fail --silent --show-error --location \
                "https://raw.githubusercontent.com/dapr/cli/v${DAPR_CLI_VERSION}/install/install.sh" \
                --output "$AGENT_TEMPDIRECTORY/install-dapr.sh"
              bash "$AGENT_TEMPDIRECTORY/install-dapr.sh" "$DAPR_CLI_VERSION"
              dapr init --slim --runtime-version "$DAPR_RUNTIME_VERSION"
              dapr --version

              SSL_CERT_DIR="$HOME/.aspnet/dev-certs/trust" dotnet dev-certs https --trust
            displayName: "Test Preparation"
            env:
              DAPR_CLI_VERSION: $(daprCliVersion)
              DAPR_RUNTIME_VERSION: $(daprRuntimeVersion)

          - script: bash .azdo/scripts/report-disk-usage.sh "After test preparation"
            displayName: "Measure disk usage after test preparation"
            condition: always()

          - task: DotNetCoreCLI@2
            inputs:
              command: "test"
              projects: "FakeSurveyGenerator.slnx"
              publishTestResults: false
              arguments: >-
                --no-build --configuration Debug --coverage --report-trx
                --results-directory "$(Agent.TempDirectory)/backend-tests"
            displayName: "Run Tests"

          - script: bash .azdo/scripts/select-test-results.sh
            displayName: "Select non-duplicated backend test and coverage reports"
            condition: succeededOrFailed()
            env:
              TEST_RESULTS_DIRECTORY: $(Agent.TempDirectory)/backend-tests

          - task: PublishTestResults@2
            displayName: "Publish Backend Test Results and Coverage Attachments"
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: "VSTest"
              searchFolder: "$(Agent.TempDirectory)/backend-tests"
              testResultsFiles: "$(BackendTestResultsPattern)"
              mergeTestResults: true
              publishRunAttachments: true
              failTaskOnFailedTests: true
              failTaskOnMissingResultsFile: true

          # TRX attachment publication alone did not populate the coverage UI in run 7123.
          # Publish MTP's merged coverage explicitly, without re-collecting or duplicating it.
          - task: PublishCodeCoverageResults@2
            displayName: "Publish Backend Code Coverage"
            condition: succeededOrFailed()
            inputs:
              summaryFileLocation: "$(Agent.TempDirectory)/backend-tests/$(BackendCoveragePattern)"
              pathToSources: "$(Build.SourcesDirectory)"
              failIfCoverageEmpty: true

          - script: bash .azdo/scripts/report-disk-usage.sh "After tests"
            displayName: "Measure disk usage after tests"
            condition: always()

          - script: |
              dotnet tool restore
              dotnet dotnet-ef migrations script -o DbMigrationScript.sql -i
            workingDirectory: src/server/FakeSurveyGenerator.Application
            displayName: "Create Database Migration Script"

          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: "src/server/FakeSurveyGenerator.Application/DbMigrationScript.sql"
              artifact: "DbMigrationScript"
            displayName: "Publish Database Migration Script"

  - stage: BuildTestUI
    displayName: "Build + Test UI"
    dependsOn: []
    jobs:
      - job: BuildAndTest
        displayName: "Build + Test"
        pool:
          vmImage: "ubuntu-24.04"
        steps:
          - checkout: self
            fetchDepth: 0

          - task: UseNode@1
            displayName: "Install Node.js"
            inputs:
              version: "26.x"

          - task: Npm@1
            displayName: "Install Frontend Dependencies"
            inputs:
              command: "ci"
              workingDir: "src/client/ui"

          - task: UseDotNet@2
            displayName: "Install .NET SDK for API contracts"
            inputs:
              packageType: "sdk"
              useGlobalJson: true
              includePreviewVersions: true

          - task: Npm@1
            displayName: "Install API Contract Tooling"
            inputs:
              command: "ci"
              workingDir: "tools/api-contracts"

          - script: npm run check:api
            workingDirectory: "src/client/ui"
            displayName: "Check Generated API Contracts"

          - script: npm run build
            workingDirectory: "src/client/ui"
            displayName: "Build Frontend"

          - script: npx playwright install --with-deps --only-shell chromium
            workingDirectory: "src/client/ui"
            displayName: "Install Playwright Chromium"

          - task: Npm@1
            displayName: "Run Frontend Unit Tests"
            inputs:
              command: "custom"
              workingDir: "src/client/ui"
              customCommand: "test -- --run --reporter=junit --reporter=default
                --outputFile.junit=./test-results/junit.xml"

          - task: PublishTestResults@2
            displayName: "Publish Frontend Test Results"
            inputs:
              testResultsFormat: "JUnit"
              testResultsFiles: "src/client/ui/test-results/junit.xml"
              failTaskOnFailedTests: true
            condition: succeededOrFailed()

  - stage: Infrastructure_Database_Deployment
    condition: and(succeeded(), eq(variables.isMain, true))
    dependsOn:
      - BuildTestApi
      - BuildTestUI
    displayName: "Provision Infrastructure + Deploy Database"
    jobs:
      - job: ProvisionInfrastructure
        displayName: Provision Infrastructure
        pool:
          vmImage: "ubuntu-24.04"
        steps:
          # azd initializes C# user secrets even when provisioning only Bicep.
          - task: UseDotNet@2
            displayName: "Install .NET SDK for azd service initialization"
            inputs:
              packageType: "sdk"
              useGlobalJson: true
              includePreviewVersions: true

          - task: setup-azd@1
            displayName: Install azd
            inputs:
              version: $(azdVersion)

          - script: |
              set -euo pipefail
              azd config set auth.useAzCliAuth "true"
              azd config set alpha.deployment.stacks on
            displayName: Configure AZD

          - task: AzureCLI@2
            displayName: Provision Infrastructure
            inputs:
              azureSubscription: $(azureResourceManagerConnection)
              scriptType: bash
              scriptLocation: inlineScript
              visibleAzLogin: false
              inlineScript: |
                set -euo pipefail
                azd provision --no-prompt
            env:
              AZURE_SUBSCRIPTION_ID: $(azureSubscriptionId)
              AZURE_ENV_NAME: $(azureEnvName)
              AZURE_LOCATION: $(azureLocation)
              AZURE_RESOURCE_GROUP: $(azureResourceGroup)
              TYPE_SAFE_API_KEY: $(typeSafeApiKey)

      - deployment: Deployment_Job
        dependsOn: ProvisionInfrastructure
        displayName: Deploy Database Migration Script
        pool:
          vmImage: "windows-latest"
        variables:
          sqlServerName: "sql-fake-survey-generator.database.windows.net"
          sqlDatabaseName: sqldb-fake-survey-generator
        environment: "azure-sql"
        strategy:
          runOnce:
            deploy:
              steps:
                # Disable the automatic all-artifact download, then fetch only migration SQL.
                - download: none
                - download: current
                  artifact: DbMigrationScript

                - task: SqlAzureDacpacDeployment@1
                  displayName: "Execute SQL Migration Script"
                  inputs:
                    azureSubscription: $(azureResourceManagerConnection)
                    AuthenticationType: "servicePrincipal"
                    ServerName: "$(sqlServerName)"
                    DatabaseName: "$(sqlDatabaseName)"
                    deployType: SqlTask
                    SqlFile: "$(Pipeline.Workspace)/DbMigrationScript/DbMigrationScript.sql"

  - stage: App_Deployment
    displayName: "Deploy App"
    condition: and(succeeded(), eq(variables.isMain, true))
    dependsOn:
      - BuildTestApi
      - BuildTestUI
      - Infrastructure_Database_Deployment
    jobs:
      - job: Deploy
        displayName: "Deploy App"
        pool:
          vmImage: "ubuntu-24.04"
        variables:
          releaseVersion: $[stageDependencies.BuildTestApi.Package.outputs['SetReleaseVersion.ReleaseVersion']]
          imageDigest: $[stageDependencies.BuildTestApi.Package.outputs['PublishImage.ImageDigest']]
        steps:
          # Prebuilt-image deployment still initializes the C# service through dotnet.
          - task: UseDotNet@2
            displayName: "Install .NET SDK for azd service initialization"
            inputs:
              packageType: "sdk"
              useGlobalJson: true
              includePreviewVersions: true

          - task: setup-azd@1
            displayName: Install azd
            inputs:
              version: $(azdVersion)

          - task: AzureCLI@2
            displayName: Deploy Application
            inputs:
              azureSubscription: $(azureResourceManagerConnection)
              scriptType: bash
              scriptLocation: scriptPath
              scriptPath: .azdo/scripts/deploy-image.sh
              visibleAzLogin: false
            env:
              AZURE_SUBSCRIPTION_ID: $(azureSubscriptionId)
              AZURE_ENV_NAME: $(azureEnvName)
              AZURE_LOCATION: $(azureLocation)
              AZURE_RESOURCE_GROUP: $(azureResourceGroup)
              TYPE_SAFE_API_KEY: $(typeSafeApiKey)
              API_VERSION: $(releaseVersion)
              IMAGE_DIGEST: $(imageDigest)
              CUSTOM_DOMAIN_NAME: fakesurveygenerator.mysecondarydomain.com
