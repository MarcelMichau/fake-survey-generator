version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "Microsoft.OpenApi"
    groups:
      nuget-dependencies:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: "/src/client/ui"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      npm-dependencies:
        patterns:
          - "*"
  - package-ecosystem: dotnet-sdk
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      dotnet-sdk-dependencies:
        patterns:
          - "*"
  - package-ecosystem: docker
    directory: "/src/server/FakeSurveyGenerator.Api"
    schedule:
      interval: "weekly"
    groups:
      docker-dependencies:
        patterns:
          - "*"
  - package-ecosystem: docker
    directory: "/src/server/FakeSurveyGenerator.Worker"
    schedule:
      interval: "weekly"
    groups:
      docker-dependencies:
        patterns:
          - "*"
